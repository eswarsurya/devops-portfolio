name: aiops-triage-agent

on:
  push:
    branches: [main]
    paths: ["projects/aiops-triage-agent/**", ".github/workflows/aiops-triage-agent-ci.yml"]
  pull_request:
    paths: ["projects/aiops-triage-agent/**", ".github/workflows/aiops-triage-agent-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/eswarsurya/aiops-triage-agent

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/aiops-triage-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/aiops-triage-agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (no API key needed - the model is mocked)
        run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: projects/aiops-triage-agent
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Smoke test
        run: |
          docker run -d --name t -p 8080:8080 "$IMAGE:latest"
          for _ in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "AIOps Triage"
          docker exec t kubectl version --client
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags "$IMAGE"
