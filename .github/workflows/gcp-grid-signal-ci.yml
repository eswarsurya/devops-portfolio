name: gcp-grid-signal

on:
  push:
    branches: [main]
    paths: ["projects/gcp-grid-signal/**", ".github/workflows/gcp-grid-signal-ci.yml"]
  pull_request:
    paths: ["projects/gcp-grid-signal/**", ".github/workflows/gcp-grid-signal-ci.yml"]
  schedule:
    - cron: "41 8 * * 1-5"   # weekday morning: is EirGrid's live feed still in the format we parse?
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: projects/gcp-grid-signal

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gcp-grid-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/gcp-grid-signal/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (store and EirGrid are faked; no GCP account needed)
        run: pytest -q
      - name: ShellCheck the carbon gate
        run: shellcheck carbon-gate/gate.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gcp-grid-signal/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Terraform tests (mocked Google provider)
        run: terraform test

  container:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gcp-grid-signal
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t grid-signal .
      - name: Smoke test the image the way Cloud Run runs it
        run: |
          docker run -d --name gs -p 8080:8080 -e STORE=memory grid-signal
          for _ in $(seq 1 20); do curl -fs localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q "Grid Signal"
          # No data yet: health must say so (503), and the badge must still render.
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/health)" = 503 ]
          curl -fs localhost:8080/badge.svg | grep -q "no data"
          docker run --rm -e STORE=memory grid-signal python -c "import app.ingest"
      - name: Carbon gate opens against a fake API
        run: |
          mkdir -p /tmp/fake/api && echo '{"intensity_g_per_kwh": 140}' > /tmp/fake/api/now
          (cd /tmp/fake && python3 -m http.server 8765 &) && sleep 1
          API_URL=http://localhost:8765 MAX_WAIT_MINUTES=0 carbon-gate/gate.sh | tee gate.log
          grep -q "Going ahead after 0 min" gate.log

  live-feed-contract:
    # The real-world risk: EirGrid's undocumented endpoint changes shape or stops answering.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gcp-grid-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1 fastapi==0.143.0
      - name: Fetch and parse today's live readings
        run: |
          python - <<'PY'
          import datetime as dt
          from app.eirgrid import DUBLIN, fetch_day
          now = dt.datetime.now(DUBLIN)
          days = fetch_day(now.date()) or fetch_day(now.date() - dt.timedelta(days=1))
          day = max(days)
          values = days[day]
          slots = sorted(k[:5] for k in values if k.endswith("/intensity"))
          assert slots, "no CO2 intensity readings parsed"
          latest = dt.datetime.fromisoformat(f"{day}T{slots[-1]}").replace(tzinfo=DUBLIN)
          age = (now - latest).total_seconds() / 60
          print(f"{len(slots)} intensity readings for {day}; latest {slots[-1]} = {values[slots[-1] + '/intensity']} gCO2/kWh, {age:.0f} min old")
          print("wind/demand present:", f"{slots[-1]}/wind" in values, f"{slots[-1]}/demand" in values)
          assert age < 180, "feed looks stale"
          PY

  deploy:
    # Runs only once the GCP project exists and the repository variables below are set.
    needs: [test, terraform, container]
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    environment: gcp
    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token that Workload Identity Federation exchanges
    env:
      REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
      IMAGE: ${{ vars.GCP_REGION || 'europe-west1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/grid-signal/grid-signal
    defaults:
      run:
        working-directory: projects/gcp-grid-signal
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:${GITHUB_SHA::7}"
      - name: Deploy API and ingest job
        run: |
          gcloud run deploy grid-signal --image "$IMAGE:${GITHUB_SHA::7}" --region "$REGION" --quiet
          gcloud run jobs update grid-signal-ingest --image "$IMAGE:${GITHUB_SHA::7}" --region "$REGION" --quiet
          gcloud run jobs execute grid-signal-ingest --region "$REGION" --wait --quiet
      - name: Check the live service
        run: |
          url=$(gcloud run services describe grid-signal --region "$REGION" --format 'value(status.url)')
          curl -fsS "$url/health"; echo
          curl -fsS "$url/api/now"; echo
          echo "### Live: $url" >> "$GITHUB_STEP_SUMMARY"
