name: hybrid-cloud-k8s-admin

on:
  push:
    branches: [main, "build/hybrid-*"]
    paths:
      - "projects/hybrid-cloud-k8s-admin/**"
      - ".github/workflows/hybrid-cloud-k8s-admin-ci.yml"
  pull_request:
    paths:
      - "projects/hybrid-cloud-k8s-admin/**"
      - ".github/workflows/hybrid-cloud-k8s-admin-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # AWS hybrid network and AKS: format, validate, and unit tests against mocked providers
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [aws-hybrid-network, azure-aks]
    defaults:
      run:
        working-directory: projects/hybrid-cloud-k8s-admin/terraform/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend, no cloud credentials)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: |
          if ! terraform validate -no-color > v.log 2>&1; then
            cat v.log; echo "::error title=validate ${{ matrix.dir }}::$(tail -20 v.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1
          fi
      - name: Unit tests (mocked provider)
        run: |
          if ! terraform test -no-color > t.log 2>&1; then
            cat t.log; echo "::error title=terraform test ${{ matrix.dir }}::$(grep -E 'Error|error_message|fail|│' t.log | head -25 | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1
          fi
          cat t.log

  # Azure DevOps and GitLab CI pipelines checked against their published schemas
  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/hybrid-cloud-k8s-admin/pipelines
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet check-jsonschema==0.38.2
      - name: Azure DevOps pipeline and template
        run: check-jsonschema --regex-variant python --builtin-schema vendor.azure-pipelines azure-pipelines.yml templates/helm-deploy.yml
      - name: GitLab CI pipeline
        run: check-jsonschema --builtin-schema vendor.gitlab-ci gitlab-ci.yml

  # CKA-style drills on a real 3-node cluster
  k8s-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/hybrid-cloud-k8s-admin/k8s-admin
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind && kind version && kubectl version --client
      - name: Create the cluster
        run: kind create cluster --config kind-cluster.yaml --image kindest/node:v1.31.2 --wait 180s
      - name: ShellCheck
        run: shellcheck run-drills.sh
      - name: Run the drills
        run: ./run-drills.sh
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get nodes -o wide; kubectl get pods -A -o wide
          echo "::warning title=pods::$(kubectl get pods -A --no-headers 2>&1 | awk '$4!="Running" && $4!="Completed"' | head -15 | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::warning title=events::$(kubectl get events -A --sort-by=.lastTimestamp 2>&1 | tail -12 | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"

  # Cluster administration drills on a 3-node OpenSearch cluster
  opensearch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/hybrid-cloud-k8s-admin/opensearch
    steps:
      - uses: actions/checkout@v4
      - name: Kernel setting OpenSearch needs
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start the cluster
        run: docker compose up -d
      - name: ShellCheck
        run: shellcheck run-admin-drills.sh
      - name: Run the drills
        run: ./run-admin-drills.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          for svc in os1 os2 os3 dashboards; do
            echo "::warning title=logs $svc::$(docker compose logs --no-color --tail=10 $svc 2>&1 | cut -c1-250 | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
      - name: Tear down
        if: always()
        run: docker compose down -v
