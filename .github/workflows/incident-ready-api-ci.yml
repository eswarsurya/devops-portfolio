name: incident-ready-api CI

on:
  pull_request:
    paths:
      - "projects/incident-ready-api/**"
      - ".github/workflows/incident-ready-api-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/incident-ready-api/**"
      - ".github/workflows/incident-ready-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/incident-ready-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/incident-ready-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Build container image
        run: docker build -t incident-ready-api:ci .
      - name: Inspect image user
        run: docker image inspect incident-ready-api:ci --format '{{.Config.User}}'
