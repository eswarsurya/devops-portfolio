name: llm-gateway

on:
  push:
    branches: [main]
    paths: ["projects/llm-gateway/**", ".github/workflows/llm-gateway-ci.yml"]
  pull_request:
    paths: ["projects/llm-gateway/**", ".github/workflows/llm-gateway-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/eswarsurya/devops-portfolio/llm-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/llm-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/llm-gateway/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (upstream mocked - no API key needed)
        run: pytest -q
      - name: Secret scan (the company key must never be committed)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: projects/llm-gateway
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Smoke test with mock upstream
        run: |
          KEY=gw-ci-test
          HASH=$(python3 -c "import hashlib;print(hashlib.sha256(b'$KEY').hexdigest())")
          cat > gateway.yaml <<EOF
          pricing: {claude-haiku-5-5: {input: 0.10, output: 0.50}}
          teams: [{name: ci, key_sha256: "$HASH", models: [claude-haiku-5-5]}]
          EOF
          docker run -d -p 8080:8080 -e GATEWAY_UPSTREAM=mock -v "$PWD/gateway.yaml:/config/gateway.yaml:ro" "$IMAGE:latest"
          for _ in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          curl -fs localhost:8080/v1/messages -H "x-api-key: $KEY" -H 'content-type: application/json' \
            -d '{"model":"claude-haiku-5-5","max_tokens":50,"messages":[{"role":"user","content":"hi"}]}'
          curl -fs localhost:8080/metrics | grep gateway_cost_usd_total
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags "$IMAGE"
