name: rail-pulse

on:
  push:
    branches: [main]
    paths: ["projects/rail-pulse/**", ".github/workflows/rail-pulse-ci.yml"]
  pull_request:
    paths: ["projects/rail-pulse/**", ".github/workflows/rail-pulse-ci.yml"]
  schedule:
    - cron: "17 7 * * 1-5"   # weekday morning: check the LIVE feed format hasn't changed
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/eswarsurya/rail-pulse

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rail-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/rail-pulse/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests (offline fixtures)
        run: pytest -q
      - name: Validate and unit-test Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/deploy:/d" -w /d --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
          docker run --rm -v "$PWD/deploy:/d" -w /d --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts_test.yml

  live-feed-contract:
    # Catches the real-world failure mode: the upstream API changes shape.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/rail-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Parse the live Irish Rail feed
        run: |
          python - <<'PY'
          from railpulse.feed import parse_trains
          from railpulse.poller import fetch_feed
          trains = parse_trains(fetch_feed())
          running = [t for t in trains if t.status == "running"]
          print(f"{len(trains)} trains, {len(running)} running")
          assert trains, "feed returned no parsable trains"
          if running:
              with_delay = sum(t.delay_min is not None for t in running)
              assert with_delay / len(running) > 0.5, "delay parsing looks broken"
          PY

  image:
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: projects/rail-pulse
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .
      - name: Smoke test in replay mode
        run: |
          docker run -d -p 8000:8000 -e RAILPULSE_REPLAY=/app/tests/fixtures "$IMAGE:latest"
          for _ in $(seq 1 20); do curl -fs localhost:8000/ready && break; sleep 1; done
          curl -fs localhost:8000/metrics | grep railpulse_on_time_ratio
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push --all-tags "$IMAGE"
