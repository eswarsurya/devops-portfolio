# Merge into kube-prometheus-stack values (alertmanager.config) in k8s-gitops-platform.
# Sends firing alerts to the triage agent; the token stops anyone else triggering it.
alertmanager:
  config:
    route:
      receiver: aiops-triage
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      repeat_interval: 4h
    receivers:
      - name: aiops-triage
        webhook_configs:
          - url: http://aiops-triage.aiops.svc/alertmanager
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/aiops-triage/WEBHOOK_TOKEN
  alertmanagerSpec:
    secrets: ["aiops-triage"]   # mounted at /etc/alertmanager/secrets/aiops-triage/
