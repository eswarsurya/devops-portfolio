---
- name: Install fail2ban when enabled
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: linux_hardening_install_fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
  when: linux_hardening_install_fail2ban

# Ubuntu 24.04 starts sshd on demand (socket activation), so this directory may not exist yet.
# sshd -t refuses to validate without it.
- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install managed SSH hardening drop-in
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: "{{ linux_hardening_ssh_dropin_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Validate and reload SSH

- name: Install host audit helper
  ansible.builtin.copy:
    src: portfolio-host-audit
    dest: "{{ linux_hardening_audit_script_path }}"
    owner: root
    group: root
    mode: "0750"
