services:
  api:
    build:
      context: .
      args:
        APP_VERSION: local
    ports:
      - "8000:8000"
    restart: unless-stopped

  # Scrapes the API's /metrics every 15s - open http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
