# Short intervals so the lab reacts within minutes. In production 15-30s
# scrape and evaluation intervals are more usual.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/slo/rules.yml

scrape_configs:
  - job_name: kvnode
    static_configs:
      - targets: ["kv1:8080", "kv2:8080", "kv3:8080"]
