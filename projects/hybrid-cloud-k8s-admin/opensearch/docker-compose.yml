# Three-node OpenSearch cluster with Dashboards and a shared snapshot repository.
# Security plugin is off for the lab (see README trade-offs). Needs: sudo sysctl -w vm.max_map_count=262144
name: opensearch-lab

x-node: &node
  image: opensearchproject/opensearch:2.17.1
  ulimits:
    memlock: { soft: -1, hard: -1 }
    nofile: { soft: 65536, hard: 65536 }
  networks: [os]
  depends_on:
    snapshot-perms: { condition: service_completed_successfully }

x-env: &env
  cluster.name: dublin-logs
  discovery.seed_hosts: os1,os2,os3
  cluster.initial_cluster_manager_nodes: os1,os2,os3
  path.repo: /mnt/snapshots
  DISABLE_SECURITY_PLUGIN: "true"
  DISABLE_INSTALL_DEMO_CONFIG: "true"
  OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m

services:
  # the shared snapshot volume must be writable by the opensearch user (uid 1000)
  snapshot-perms:
    image: busybox:1.36.1
    command: ["chown", "-R", "1000:1000", "/mnt/snapshots"]
    volumes: [snapshots:/mnt/snapshots]

  os1:
    <<: *node
    environment: { <<: *env, node.name: os1 }
    volumes: [os1:/usr/share/opensearch/data, snapshots:/mnt/snapshots]
    ports: ["9201:9200"]
  os2:
    <<: *node
    environment: { <<: *env, node.name: os2 }
    volumes: [os2:/usr/share/opensearch/data, snapshots:/mnt/snapshots]
  os3:
    <<: *node
    environment: { <<: *env, node.name: os3 }
    volumes: [os3:/usr/share/opensearch/data, snapshots:/mnt/snapshots]

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    environment:
      OPENSEARCH_HOSTS: '["http://os1:9200","http://os2:9200","http://os3:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5602:5601"]
    networks: [os]

networks:
  os:

volumes:
  os1:
  os2:
  os3:
  snapshots:
