# The company Anthropic key lives ONLY here, as a Secret. Teams get gateway keys.
#   kubectl -n llm-gateway create secret generic llm-gateway \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... --from-literal=GATEWAY_ADMIN_TOKEN=$(openssl rand -hex 16)
#   kubectl -n llm-gateway create configmap llm-gateway-config --from-file=gateway.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: llm-gateway
  labels: { app: llm-gateway }
spec:
  replicas: 1   # limits/budgets are in-memory; move them to Redis before scaling out
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: ghcr.io/eswarsurya/llm-gateway:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: llm-gateway }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: llm-gateway-config }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: llm-gateway
  labels: { app: llm-gateway }
spec:
  selector: { app: llm-gateway }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Only pods in namespaces labelled llm-access=true may call the gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-gateway
  namespace: llm-gateway
spec:
  podSelector:
    matchLabels: { app: llm-gateway }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { llm-access: "true" }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8080, protocol: TCP }
