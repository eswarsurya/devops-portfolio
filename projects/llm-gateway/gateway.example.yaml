# llm-gateway config. Copy to gateway.yaml (git-ignored).
# Team keys are stored as SHA-256 hashes: generate with  python -m gateway.keygen <team>

# USD per million tokens. Source: Claude API pricing page (checked Oct 2026).
# Re-check before relying on cost figures - prices change.
pricing:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    long_context_threshold: 100000   # prompts above this many input tokens use the long rates
    long_input: 0.50
    long_output: 2.50
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
  claude-opus-5-5:
    input: 4.00
    output: 20.00

cache:
  ttl_seconds: 600
  max_entries: 2000

teams:
  - name: platform
    key_sha256: "replace-with-keygen-output"
    models: [claude-haiku-5-5, claude-sonnet-5-5]
    requests_per_minute: 60
    monthly_budget_usd: 50
    redact_pii: true
  - name: data-science
    key_sha256: "replace-me"
    models: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5]
    requests_per_minute: 30
    monthly_budget_usd: 200
    redact_pii: true
