# Which node served the request (checked by the load-balancing test)
Header always set X-Served-By "${NODE_NAME}"

# Trust X-Forwarded-Proto from the Nginx edge so WordPress knows the request was HTTPS
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Operations pages: only members of the LDAP "sre" group can open them
LDAPTrustedMode NONE
# no caching of logins or group lookups, so access changes apply at once (lab choice; production would keep a short TTL)
LDAPCacheEntries 0
LDAPOpCacheEntries 0
Alias /ops /srv/ops
<Directory /srv/ops>
    AuthType Basic
    AuthName "Dublin DC operations"
    AuthBasicProvider ldap
    AuthLDAPURL "ldap://ldap:389/ou=people,dc=dublin-dc,dc=lab?uid?sub?(objectClass=inetOrgPerson)"
    AuthLDAPBindDN "cn=readonly,dc=dublin-dc,dc=lab"
    AuthLDAPBindPassword "${LDAP_READONLY_PASSWORD}"
    AuthLDAPGroupAttribute member
    AuthLDAPGroupAttributeIsDN on
    Require ldap-group cn=sre,ou=groups,dc=dublin-dc,dc=lab
</Directory>

# Apache's own status page, reachable only from inside the lab network
<Location /server-status>
    SetHandler server-status
    Require ip 172.30.0.0/16
</Location>
