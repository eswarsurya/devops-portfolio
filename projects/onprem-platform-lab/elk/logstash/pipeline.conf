# Nginx JSON access logs -> Elasticsearch, one index per day
input {
  file {
    path => "/var/log/nginx/access.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-nginx"
    codec => json
  }
}
filter {
  date { match => ["time", "ISO8601"] target => "@timestamp" }
  mutate { remove_field => ["time", "event", "log"] }
  if [status] >= 500 { mutate { add_tag => ["server_error"] } }
  else if [status] == 429 { mutate { add_tag => ["rate_limited"] } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nginx-access-%{+YYYY.MM.dd}"
  }
}
