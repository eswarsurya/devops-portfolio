# Edge load balancer for the lab: TLS termination, HTTP->HTTPS, rate limiting,
# load balancing with passive health checks across two Apache/PHP nodes, and JSON access logs for Logstash.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;

  log_format json escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.json json;

  # 10 requests/second per client, short burst allowed; extra requests get 429
  limit_req_zone $binary_remote_addr zone=per_client:10m rate=10r/s;
  limit_req_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=100m inactive=10m;

  upstream web {
    least_conn;
    # passive health checks: 2 failures in 10 s takes a node out for 10 s
    server web1:80 max_fails=2 fail_timeout=10s;
    server web2:80 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 80;
    server_name portal.dublin-dc.lab;
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name portal.dublin-dc.lab;

    ssl_certificate     /etc/letsencrypt/live/portal.dublin-dc.lab/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.dublin-dc.lab/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Upstream $upstream_addr always;

    location / {
      limit_req zone=per_client burst=20 nodelay;
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_cache static;
      proxy_cache_valid 200 10m;
      add_header X-Cache $upstream_cache_status always;
    }
  }

  # internal only: Metricbeat reads connection stats here
  server {
    listen 8081;
    location /nginx_status { stub_status; allow 172.30.0.0/16; deny all; }
  }
}
