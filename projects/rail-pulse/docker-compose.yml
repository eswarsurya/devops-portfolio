# Full stack locally: app + Prometheus (with SLO alert rules) + Grafana (pre-built dashboard)
#   docker compose up --build
#   app:        http://localhost:8000
#   prometheus: http://localhost:9090/alerts
#   grafana:    http://localhost:3000  (anonymous viewer enabled for the demo)
# Offline demo: RAILPULSE_REPLAY=/app/tests/fixtures docker compose up
services:
  rail-pulse:
    build: .
    ports: ["8000:8000"]
    environment:
      RAILPULSE_REPLAY: ${RAILPULSE_REPLAY:-}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [rail-pulse]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rail-pulse.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
